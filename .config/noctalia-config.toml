[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "smolbar", "fullbar" ]

    [bar.fullbar]
    background_opacity = 0.74999998323619366
    end = [ "notifications", "tray", "bar_2", "group:g2", "network", "group:g1", "session" ]
    margin_ends = 0
    radius = 0
    start = [ "launcher", "taskbar" ]
    thickness = 26
    widget_spacing = 16

        [bar.fullbar.dead_zone.actions]
        scroll_down = "exec niri msg action focus-column-right"
        scroll_up = "exec niri msg action focus-column-left"

        [[bar.fullbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "power_profile", "battery" ]
        opacity = 1.0
        padding = 0.0
        widget_spacing = 6

        [[bar.fullbar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "volume", "input_volume" ]
        opacity = 1.0
        padding = 6.0

    [bar.smolbar]
    background_opacity = 0.69999998435378075
    border_width = 1.0
    center = [ "notifications", "clock", "bar", "task" ]
    concave_edge_corners = false
    contact_shadow = true
    enabled = false
    end = [ "tray", "network", "bluetooth", "group:g1", "power_profile", "battery", "session" ]
    font_weight = 400
    margin_ends = 300
    radius = 6
    start = [ "launcher", "cat", "taskbar" ]
    widget_spacing = 14

        [bar.smolbar.dead_zone.actions]
        scroll_down = "exec niri msg action focus-column-right"
        scroll_up = "exec niri msg action focus-column-left"

        [bar.smolbar.monitor.HDMI-A-2]
        margin_ends = 550

        [[bar.smolbar.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "volume", "input_volume" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 15

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
    warning_threshold = 15

[config]

[control_center]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "caffeine"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 3

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 150.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1200.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 120.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k" ]

[location]
address = "Curitiba, Brasil"

[lockscreen]
blur_intensity = 0.0
fingerprint = false

