cat_size = 30
type = "dotnetrob/cat:cat"

    [widget.cat.actions]
    left = "exec foot -e btop"
    right = "exec foot -e yazi"

[widget.clock]
format = "{:%H%M} - {:%d/%m}"

[widget.input_volume]
show_label = false

[widget.launcher]
