[audio]
colorize_icons = true
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "fullbar", "smolbar" ]

    [bar.fullbar]
    background_opacity = 0.59999998658895493
    capsule_group = []
    center = [ "clock", "bar_3" ]
    compositor_blur = false
    end = [ "notifications", "tray", "volume", "input_volume", "network", "power_profile", "battery", "session" ]
    margin_ends = 0
    radius = 14
    shadow = false
    start = [ "launcher", "taskbar" ]
    thickness = 24
    widget_spacing = 16

        [bar.fullbar.dead_zone.actions]
        scroll_down = "exec niri msg action focus-column-right"
        scroll_up = "exec niri msg action focus-column-left"

    [bar.smolbar]
    background_opacity = 0.69999998435378075
    border_width = 1.0
    center = [ "notifications", "clock", "bar", "task" ]
    concave_edge_corners = false
    contact_shadow = true
    enabled = false
    end = [ "tray", "network", "bluetooth", "group:g1", "power_profile", "battery", "session" ]
    font_weight = 400
    margin_ends = 300
    radius = 6
    start = [ "launcher", "cat", "taskbar" ]
    widget_spacing = 14

        [bar.smolbar.dead_zone.actions]
        scroll_down = "exec niri msg action focus-column-right"
        scroll_up = "exec niri msg action focus-column-left"

        [bar.smolbar.monitor.HDMI-A-2]
        margin_ends = 550

        [[bar.smolbar.capsule_group]]
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "volume", "input_volume" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 15

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
    warning_threshold = 15

[calendar]
enabled = true

    [calendar.account.personal_google]
