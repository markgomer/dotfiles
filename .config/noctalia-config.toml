[nightlight]
enabled = true

[notification]
filter_order = [ "filter" ]
layer = "overlay"

    [notification.filter.filter]
    allow_permanent = true
    bypass_dnd = false
    enabled = true
    match = "app.zen_browser.zen"
    play_sound = false
    save_history = true
    show_toast = true

[plugin_settings."alexander/screen-toolkit"]
selected-ocr-lang = "eng+ptbr"

[plugin_settings."blackbartblues/audio-switcher"]
show_notification_on_switch = false
show_percentage = false

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true

[plugin_settings."oldirtty/color_picker"]
panel_position = "auto"

[plugins]
enabled = [ "dotnetrob/cat", "noctalia/timer", "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/majunior/Documents/harvestmoonavatar.png"
font_family = "FantasqueSansM Nerd Font Propo"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.launcher]
    pinned = [ "app.zen_browser.zen", "foot", "org.mozilla.thunderbird_esr", "io.github.kolunmi.Bazaar", "yazi" ]

    [shell.panel]
    floating_layer = "top"
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 8

    [shell.screenshot]
    confirm_region = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "q"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "p"
    variant = "destructive"

