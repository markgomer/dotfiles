# Enable mouse support
set -g mouse on

# Enable mouse wheel scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Last/previous session (Alt+p)
bind -n M-p switch-client -l

# Tmux-sessionizer on projects (Ctrl+f)
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Ctrl+Alt+h/j/k/l to switch to windows 0-3
bind -n M-h select-window -t 1
bind -n M-j select-window -t 2
bind -n M-k select-window -t 3
bind -n M-l select-window -t 4

# Alt+h/j/k/l for vim-style pane navigation
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Tokyo Night color scheme for status bar
set -g status-style bg=#1a1b26,fg=#a9b1d6
set -g status-left-style bg=#1a1b26,fg=#7aa2f7
set -g status-right-style bg=#1a1b26,fg=#a9b1d6

# Window status styling
set -g window-status-style bg=#1a1b26,fg=#565f89
set -g window-status-current-style bg=#7aa2f7,fg=#1a1b26,bold

# Pane border colors
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#7aa2f7

# Status bar configuration
set -g status-left "#[fg=#7aa2f7,bold]Session: #S >> Tabs: "
set -g status-left-length 40
set -g status-right "Continuum: #{continuum_status}"
set -g status-justify left

# Window list format - shows window index
set -g window-status-format " #I "
set -g window-status-current-format " #I "
set -g window-status-separator ""

# Refresh status bar every second
set -g status-interval 1

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.local/share/tmux/plugins/tpm/tpm'
