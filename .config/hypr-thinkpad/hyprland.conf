# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,preferred,auto,auto

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/envs.conf

########################
### AUTOSTART / INIT ###
########################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = noctalia-shell &
exec-once = wayland-pipewire-idle-inhibit &
exec-once = ianny &
exec-once = input-remapper-control --command autoload

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,22
env = XCURSOR_THEME,remus-white

env = HYPRCURSOR_SIZE,22
env = HYPRCURSOR_THEME,remus-white

envd = QT_CURSOR_SIZE,22

cursor {
    sync_gsettings_theme = false
    no_hardware_cursors = true # 0 or 1
    enable_hyprcursor = true
    warp_on_change_workspace = 0
    no_warps = false
}

# ┏━━━━━━━━━━━━━━┓
# ┃ # XWAYLAND # ┃
# ┗━━━━━━━━━━━━━━┛
xwayland {
    force_zero_scaling = true
}
# xwayland apps scale fix (useful if you are use monitor scaling).
# Set same value if you use scaling in Monitors.conf
# 1 is 100% 1.5 is 150%
# see https://wiki.hyprland.org/Configuring/XWayland/
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = QT_SCALE_FACTOR,1

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 6

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)

    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

master {
    new_status = master
    new_on_top = true
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 14
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 2
        render_power = 1
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false # crap sucks a lot of resources
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = no
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vfr = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = br
    kb_variant = thinkpad
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = false

    repeat_rate = 30
    repeat_delay = 250

    follow_mouse = 1

    # Increase sensitity for mouse/trackpack (default: 0)
    sensitivity = 0.3
    accel_profile = flat

    touchpad {
        # Use natural (inverse) scrolling
        natural_scroll = true

        # Use two-finger clicks for right-click instead of lower-right corner
        # clickfinger_behavior = true

        # Control the speed of your scrolling
        scroll_factor = 0.4
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = GDK_BACKEND=x11 GDK_SCALE=1 GDK_DPI_SCALE=1.2 pcmanfm
$browser = flatpak run app.zen_browser.zen
$scripts = ~/dotfiles/.config/hypr/scripts

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser

bind = $mainMod, G, togglefloating
bind = $mainMod, O, layoutmsg, togglesplit # dwindle
bind = , F11, fullscreen
bindd = $mainMod, C, Center window, centerwindow
bind = ALT, tab, layoutmsg, cyclenext
bind = ALT, tab, bringactivetotop

# Switch between layouts
bind = $mainMod ALT, L, exec, hyprctl keyword general:layout "master"
bind = $mainMod SHIFT ALT, L, exec, hyprctl keyword general:layout "dwindle"

# Move focus with mainMod + arrow keys
bind = $mainMod, H, workspace, -1
bind = $mainMod, L, workspace, +1
bind = $mainMod, K, layoutmsg, cycleprev noloop
bind = $mainMod, J, layoutmsg, cyclenext noloop
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1
bind = $mainMod, up, layoutmsg, cycleprev noloop
bind = $mainMod, down, layoutmsg, cyclenext noloop
bind = $mainMod, M, layoutmsg, focusmaster

# Resize windows
binde = $mainMod CTRL, H, resizeactive,-10 0
binde = $mainMod CTRL, L, resizeactive,10 0
binde = $mainMod CTRL, K, resizeactive,0 -10
binde = $mainMod CTRL, J, resizeactive,0 10
binde = $mainMod CTRL, left, resizeactive,-10 0
binde = $mainMod CTRL, right, resizeactive,10 0
binde = $mainMod CTRL, up, resizeactive,0 -10
binde = $mainMod CTRL, down, resizeactive,0 10

# Swap windows
bind = $mainMod SHIFT, H, movetoworkspace, -1
bind = $mainMod SHIFT, L, movetoworkspace, +1
bind = $mainMod SHIFT, K, layoutmsg, swapprev noloop
bind = $mainMod SHIFT, J, layoutmsg, swapnext noloop
bind = $mainMod SHIFT, left, movetoworkspace, -1
bind = $mainMod SHIFT, right, movetoworkspace, +1
bind = $mainMod SHIFT, up, layoutmsg, swapprev noloop
bind = $mainMod SHIFT, down, layoutmsg, swapnext noloop
bind = $mainMod SHIFT, M, layoutmsg, swapwithmaster

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, +1
bind = $mainMod, mouse_up, workspace, -1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause, exec, playerctl play-pause
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous

# Media keys
# these are already defined by noctalia-shell
# bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
# bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
# bindl = , XF86AudioMute, exec, $ipc volume muteOutput
# bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
# bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease
bindl = , xf86AudioPlayPause, exec, $scripts/media-ctrl.sh --pause

########################
### POWER MANAGEMENT ###
########################

bindl = , xf86Sleep, exec, systemctl suspend  # sleep button

bind = $mainMod, F5, exec, hyprctl reload

################
### MONITORS ###
################

bindd = $mainMod, F3, Monitors, exec, nwg-displays

# bindl = , switch:on:Lid Switch, exec, systemctl suspend
# bindl = , switch:off:Lid Switch, exec, $scripts/monitor-both.sh

bind = $mainMod, F6, exec, $scripts/monitor-external.sh
bind = $mainMod, F7, exec, $scripts/monitor-both.sh
bind = $mainMod, F8, exec, $scripts/monitor-internal.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# Set default size for all floating windows
# WARN: guess we need to update before activating this
# windowrule = match:float on, size 480 240

################
### NOCTALIA ###
################

$ipc = noctalia-shell ipc call

# Core binds
bind = $mainMod, space, exec, $ipc launcher toggle
bind = $mainMod, S, exec, $ipc controlCenter toggle
bind = $mainMod Alt, S, exec, $ipc settings toggle
bind = $mainMod, escape, exec, $ipc sessionMenu toggle
bind = $mainMod, M, exec, $ipc plugin:mimeapp-gui openPanel

# ┏━━━━━━━━━━━━━━━━━┓
# ┃ # SCREENSHOTS # ┃
# ┗━━━━━━━━━━━━━━━━━┛
bind = $mainMod, Print, exec, $ipc plugin:screen-toolkit toggle
bind = , Print, exec, grimblast copy area
bind = CTRL ALT, Print, exec, grimblast save screen
bind = SHIFT, Print, exec, grimblast copy screen
bind = $mainMod SHIFT, Print, exec, grimblast save area
bind = CTRL, Print, exec, grimblast copy active


