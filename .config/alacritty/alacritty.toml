[general]
live_config_reload = true
working_directory = "None"
import = [ "~/.config/alacritty/themes/noctalia.toml" ]

[window]
dynamic_padding = false
decorations = "none"
title = "Alacritty@CachyOS"
opacity = 1
decorations_theme_variant = "Dark"
padding.x = 0
padding.y = 0

[window.dimensions]
columns = 88
lines = 26

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3


[font] # fc-list : family
normal = { family = "IosevkaTermSlab NFP", style = "Regular" }
bold = { family = "IosevkaTermSlab NFP", style = "Bold" }
italic = { family = "IosevkaTermSlab NFP", style = "Italic" }
size = 11.5
